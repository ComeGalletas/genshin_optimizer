name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Job-level so both the fetch step's `if:` and bench:check can read it.
    env:
      BENCH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run docs:check
      # Generated speed report must be refreshed when the search changes.
      # A full history is one deep clone per run; bench:check only needs the
      # single base commit it diffs against, so fetch just that one.
      - run: git fetch --depth=1 origin "$BENCH_BASE_SHA" || true
        if: env.BENCH_BASE_SHA != ''
      - run: npm run bench:check
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      # Bundle-size drift gate; refresh with `npm run size:update` when growth is intentional.
      - run: npm run size:check
      # Generated dataset must stay in sync with its build script + genshin-db.
      - run: npm run build:data
      - run: git diff --exit-code packages/engine/src/game/genshin/data.generated.json
