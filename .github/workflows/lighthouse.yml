name: Lighthouse

# Report-only Lighthouse run against a deployed URL. Not a merge gate.
#
# Parked (TODO 0.8). It used to run on every push to main and weekly against
# upstream's production site (rpg-build-optimizer.vercel.app), which audits
# natcat38's deploy, not this repo's code, and published the report to public
# temporary storage. This fork is local-first and has no deploy, so:
# - no push or schedule trigger: it only starts from the Actions tab, and
# - the job skips unless the repo variable LIGHTHOUSE_URL names a deploy to
#   audit (Settings > Secrets and variables > Actions > Variables).
# To bring it back, set LIGHTHOUSE_URL and restore the triggers above.
on:
  workflow_dispatch:

jobs:
  lighthouse:
    if: ${{ vars.LIGHTHOUSE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      # The action's report upload reads the commit via `git rev-parse HEAD`,
      # so it needs a checkout even though the run targets a deployed URL.
      - uses: actions/checkout@v7
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ vars.LIGHTHOUSE_URL }}
          uploadArtifacts: true
          temporaryPublicStorage: true
