name: Coverage badge

# Publishes a shields.io endpoint JSON to the `badges` branch on pushes to main.
# Kept for now (TODO 0.8). Badge URL for this repo:
# https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/ComeGalletas/genshin_optimizer/badges/coverage.json
# (README still shows upstream's badge until TODO 0.10.)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run test:coverage
      - name: Write and push badge JSON
        run: |
          PCT=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct.toFixed(1))")
          COLOR=$(node -e "const p=$PCT; console.log(p>=90?'brightgreen':p>=80?'green':p>=70?'yellow':'red')")
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout --orphan badges-new
          git rm -rf --quiet . || true
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > coverage.json
          git add coverage.json
          git commit -m "coverage badge: $PCT%"
          # Force-push is safe here: `badges` is a disposable orphan branch with a single
          # generated file and no other consumers/branch protection, so overwriting its
          # history each run is intentional and can't clobber real work.
          git push --force origin badges-new:badges
